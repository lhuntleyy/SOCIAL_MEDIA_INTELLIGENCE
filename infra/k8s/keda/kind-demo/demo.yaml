apiVersion: v1
kind: ConfigMap
metadata: { name: prom-cfg, namespace: default }
data:
  prometheus.yml: |
    global: { scrape_interval: 5s }
    scrape_configs:
      - job_name: smip-scheduler
        static_configs: [{ targets: ["EXPORTER_IP:9464"] }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: default }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1h"]
          resources: { requests: { memory: 64Mi }, limits: { memory: 256Mi } }
          volumeMounts: [{ name: cfg, mountPath: /etc/prometheus }]
      volumes: [{ name: cfg, configMap: { name: prom-cfg } }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: default }
spec: { selector: { app: prometheus }, ports: [{ port: 9090 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker-fetch-bun, namespace: default }
spec:
  replicas: 0
  selector: { matchLabels: { app: worker-fetch-bun } }
  template:
    metadata: { labels: { app: worker-fetch-bun } }
    spec:
      containers:
        - name: dummy
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources: { requests: { memory: 8Mi, cpu: 5m } }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: worker-fetch-bun, namespace: default }
spec:
  scaleTargetRef: { name: worker-fetch-bun }
  minReplicaCount: 0
  maxReplicaCount: 4
  pollingInterval: 5
  cooldownPeriod: 30
  advanced: { horizontalPodAutoscalerConfig: { behavior: { scaleDown: { stabilizationWindowSeconds: 10 } } } }
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.default.svc:9090
        query: max(smip_queue_depth{queue="fetch.bun",state="backlog"})
        threshold: "5"
